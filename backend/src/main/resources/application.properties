spring.application.name=spendly-backend
server.port=8080

# SQLite Datasource Configuration
# Stores database in data/spendly.db relative to backend directory or environment variable DB_PATH
spring.datasource.url=jdbc:sqlite:${DB_PATH:data/spendly.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hikari Connection Pool Settings for SQLite (Single-threaded write optimization)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA foreign_keys=ON;

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
spendly.jwt.secret=spendly_production_grade_super_secret_jwt_key_must_be_256_bits_long_example!
spendly.jwt.expiration-ms=86400000

# Logging
logging.level.com.spendly=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
